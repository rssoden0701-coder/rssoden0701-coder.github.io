<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <title>夢月｜給与振込口座の登録</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* 夢月スタッフ専用給与口座フォーム：非公開・検索除外・黒紺×金の静謐な事務導線 */
    :root{--bg:#0b0d15;--panel:#141826;--panel2:#10131f;--gold:#c9a24b;--gold-soft:#e0c583;--line:#30384d;--text:#f1eee7;--muted:#a7a9b1;--err:#ef8f7e;--ok:#9ed9ad}
    *{box-sizing:border-box} html{background:var(--bg)}
    body{margin:0;background:radial-gradient(820px 360px at 50% -120px,rgba(201,162,75,.16),transparent 64%),linear-gradient(180deg,#101426 0%,var(--bg) 55%);color:var(--text);font-family:"Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.7;padding:28px 16px 64px;min-height:100vh}
    .wrap{max-width:580px;margin:0 auto}.crest{text-align:center;margin-bottom:6px}.crest img{width:76px;height:76px;object-fit:contain;margin:0 auto 8px;filter:drop-shadow(0 10px 28px rgba(201,162,75,.28))}
    h1{font-family:"Noto Serif JP",serif;font-weight:600;letter-spacing:.24em;font-size:29px;margin:0 0 2px;text-indent:.24em}.sub{text-align:center;color:var(--gold-soft);font-size:10px;letter-spacing:.28em;margin-bottom:5px}.badge{display:inline-block;color:var(--gold-soft);border:1px solid rgba(201,162,75,.45);font-size:10px;letter-spacing:.14em;padding:4px 10px;margin:10px auto 0}
    .lead{text-align:center;color:var(--muted);font-size:13.5px;margin:16px auto 24px;max-width:480px}.security{background:rgba(201,162,75,.07);border:1px solid rgba(201,162,75,.25);border-radius:12px;padding:12px 14px;font-size:12px;color:#d9d1bd;margin:0 0 16px}.security b{color:var(--gold-soft);font-weight:500}
    .card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:16px;box-shadow:0 14px 42px rgba(0,0,0,.17)}.sec{display:flex;align-items:center;gap:10px;margin:2px 0 16px}.sec .n{font-family:"Noto Serif JP",serif;color:var(--gold);font-size:14px;border:1px solid var(--gold);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}.sec h2{font-size:15px;font-weight:500;margin:0;letter-spacing:.08em}
    label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em}label .req{color:var(--gold);font-size:11px;margin-left:6px}.field{margin-bottom:16px}.row{display:flex;gap:12px}.row .field{flex:1}
    input[type=text],input[type=tel],input[type=date],select{width:100%;background:#0b0e18;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px;padding:12px 13px;font-family:inherit;transition:border .15s,box-shadow .15s}input::placeholder{color:#626779}input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.16)}.hint{font-size:11.5px;color:#85899a;margin-top:6px}
    .radios{display:flex;gap:10px;flex-wrap:wrap}.radios label{position:relative;margin:0;cursor:pointer}.radios input{position:absolute;opacity:0}.radios span{display:block;padding:10px 18px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px;transition:.15s}.radios input:checked+span{border-color:var(--gold);background:rgba(201,162,75,.12);color:var(--gold-soft)}
    .check{display:flex;gap:11px;align-items:flex-start;background:#0b0e18;border:1px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer}.check input{margin-top:3px;accent-color:var(--gold);width:17px;height:17px;flex:0 0 auto}.check .t{font-size:13px;color:var(--text)}.yucho{border-top:1px dashed var(--line);margin-top:6px;padding-top:16px}.note{background:rgba(201,162,75,.06);border:1px solid rgba(201,162,75,.22);border-radius:12px;padding:14px 16px;font-size:12.5px;color:#d2ced0;margin-bottom:18px}.note b{color:var(--gold-soft);font-weight:500}
    button{width:100%;background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#1a1408;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;letter-spacing:.1em;font-family:inherit;cursor:pointer;transition:.15s;box-shadow:0 8px 24px rgba(201,162,75,.25)}button:hover{filter:brightness(1.05)}button:active{transform:translateY(1px)}button:disabled{opacity:.55;cursor:not-allowed}.err-msg,.form-status{color:var(--err);font-size:12px;margin-top:6px;display:none}.form-status{padding:10px 12px;border:1px solid rgba(239,143,126,.45);border-radius:9px;background:rgba(239,143,126,.08);margin-bottom:12px}.field.invalid input,.field.invalid select{border-color:var(--err)}.field.invalid .err-msg{display:block}
    .privacy{text-align:center;color:#85899a;font-size:11px;margin-top:20px;line-height:1.8}#done{display:none;text-align:center;padding:36px 10px}.done-mark{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 32%,var(--gold-soft),var(--gold) 55%,#80642c 100%);color:#0d0d12;font-size:27px;box-shadow:0 8px 30px rgba(201,162,75,.3)}#done h2{font-family:"Noto Serif JP",serif;font-weight:600;letter-spacing:.1em;font-size:22px;margin:0 0 10px}#done p{color:var(--muted);font-size:14px}.footer{text-align:center;color:#64697a;font-size:10px;letter-spacing:.18em;margin-top:34px}
    @media(max-width:480px){body{padding:22px 12px 54px}.card{padding:20px 16px}.row{gap:10px}.crest img{width:68px;height:68px}h1{font-size:26px}.row .field[style]{flex:1!important}}
  </style>
<meta property="og:type" content="website">

		<meta property="og:image:width" content="1200">

		<meta name="twitter:title" content="夢月｜給与振込口座の登録">
		<meta name="twitter:image" content="https://mutsuki-miyakojima.com/assets/hero_clean-JzKiYKtYDcGwHdQbjL3NM9.webp">
		<meta name="twitter:image:width" content="1200">
		<meta name="twitter:image:height" content="630"><link rel="canonical" href="https://mutsuki-miyakojima.com/staff-payroll-h7c4n9q2/index.html" /></head>
<body>
  <main class="wrap">
    <header class="crest">
      <img src="../assets/logo-mark-gold_0efc1207.png" alt="夢月">
      <h1>夢月</h1>
      <div class="sub">M U T S U K I</div>
    </header>

    <form id="payroll-form" novalidate autocomplete="on">
      <section class="card" aria-labelledby="identity-heading">
        <div class="sec"><div class="n">1</div><h2 id="identity-heading">ご本人情報</h2></div>
        <div class="field"><label for="kana">フリガナ<span class="req">必須</span></label><input id="kana" type="text" name="kana" placeholder="ヤキニク タロウ" autocomplete="off" required><div class="err-msg">フリガナをご入力ください</div></div>
        <div class="field"><label for="name">お名前<span class="req">必須</span></label><input id="name" type="text" name="name" placeholder="焼肉 太郎" autocomplete="name" required><div class="err-msg">お名前をご入力ください</div></div>
        <div class="row">
          <div class="field"><label for="birth">生年月日<span class="req">必須</span></label><input id="birth" type="date" name="birth" autocomplete="bday" required><div class="err-msg">ご入力ください</div></div>
          <div class="field"><label for="tel">携帯番号<span class="req">必須</span></label><input id="tel" type="tel" name="tel" placeholder="090-0000-0000" autocomplete="tel" inputmode="tel" required><div class="err-msg">ご入力ください</div></div>
        </div>
      </section>

      <section class="card" aria-labelledby="bank-heading">
        <div class="sec"><div class="n">2</div><h2 id="bank-heading">振込先口座</h2></div>
        <div class="row">
          <div class="field" style="flex:2"><label for="bank">金融機関名<span class="req">必須</span></label><input id="bank" type="text" name="bank" placeholder="○○銀行 / 信金 / ゆうちょ" autocomplete="off" required><div class="err-msg">ご入力ください</div></div>
          <div class="field" style="flex:1"><label for="bankcode">銀行コード</label><input id="bankcode" type="text" name="bankcode" placeholder="4桁" inputmode="numeric" maxlength="4" autocomplete="off"></div>
        </div>
        <div class="row">
          <div class="field" style="flex:2"><label for="branch">支店名<span class="req">必須</span></label><input id="branch" type="text" name="branch" placeholder="○○支店" autocomplete="off" required><div class="err-msg">ご入力ください</div></div>
          <div class="field" style="flex:1"><label for="branchcode">支店コード</label><input id="branchcode" type="text" name="branchcode" placeholder="3桁" inputmode="numeric" maxlength="3" autocomplete="off"></div>
        </div>
        <fieldset class="field" style="border:0;padding:0;margin-left:0;margin-right:0"><legend><label>預金種別<span class="req">必須</span></label></legend><div class="radios"><label><input type="radio" name="type" value="普通" required><span>普通</span></label><label><input type="radio" name="type" value="当座"><span>当座</span></label><label><input type="radio" name="type" value="貯蓄"><span>貯蓄</span></label></div><div class="err-msg" style="margin-top:8px">預金種別をお選びください</div></fieldset>
        <div class="field"><label for="number">口座番号<span class="req">必須</span></label><input id="number" type="text" name="number" placeholder="7桁（ゆうちょの方は下欄へ）" inputmode="numeric" maxlength="8" autocomplete="off" required><div class="err-msg">ご入力ください</div></div>
        <div class="field"><label for="holder">口座名義（カナ）<span class="req">必須</span></label><input id="holder" type="text" name="holder" placeholder="ヤキニク タロウ" autocomplete="off" required><div class="hint">必ずご本人名義でご入力ください（ご家族名義は不可）。</div><div class="err-msg">ご入力ください</div></div>
        <div class="yucho"><label style="color:var(--gold-soft)">ゆうちょ銀行をご利用の方のみ</label><div class="row"><div class="field"><label for="yucho-kigo">記号</label><input id="yucho-kigo" type="text" name="yucho_kigo" placeholder="5桁" inputmode="numeric" maxlength="5" autocomplete="off"></div><div class="field"><label for="yucho-bango">番号</label><input id="yucho-bango" type="text" name="yucho_bango" placeholder="最大8桁" inputmode="numeric" maxlength="8" autocomplete="off"></div></div></div>
      </section>

      <section class="card"><label class="check" for="confirm"><input id="confirm" type="checkbox" name="confirm" required><span class="t">上記の口座はすべて本人名義であり、記入内容に相違ないことを確認しました。</span></label><div class="err-msg" style="margin-top:8px" id="confirm-err">チェックをお願いします</div></section>
      <p id="form-status" class="form-status" role="alert" aria-live="polite"></p>
      <button type="submit" id="submit">この内容で登録する</button>
      <p class="privacy">ご登録いただいた情報は、給与振込手続きおよびこれに付随する事務の目的にのみ使用し、法令に基づく場合を除き第三者へ提供いたしません。</p>
    </form>

    <section id="done" aria-live="polite"><div class="done-mark">✓</div><h2>ご登録ありがとうございました</h2><p>口座情報を受け付けました。</p></section>
    <footer class="footer">夢月　MUTSUKI</footer>
  </main>

  <script>
    // Google Apps ScriptのウェブアプリURL。給与口座回答用スプレッドシートへ書き込みます。
    const ENDPOINT = "https://script.google.com/macros/s/AKfycbwRulYt3QdscBbBalt9lQS7lWwgmzRuUsd5YC8bwG43xtO56ETvM0YO6B3Ugdi5Cb7f/exec";
    const form = document.getElementById('payroll-form');
    const button = document.getElementById('submit');
    const status = document.getElementById('form-status');

    const markInvalid = (element, invalid) => {
      const field = element.closest('.field') || element.closest('.card');
      if (field) field.classList.toggle('invalid', invalid);
    };

    const numericFields = ['bankcode','branchcode','number','yucho_kigo','yucho_bango'];
    numericFields.forEach((name) => form.elements[name].addEventListener('input', (event) => {
      event.target.value = event.target.value.replace(/[^0-9]/g, '');
    }));

    form.addEventListener('input', (event) => {
      const field = event.target.closest('.field');
      if (field) field.classList.remove('invalid');
      status.style.display = 'none';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      let valid = true;
      form.querySelectorAll('[required]').forEach((element) => {
        if (element.type === 'radio') {
          const group = form.querySelectorAll(`[name="${element.name}"]`);
          const checked = [...group].some((radio) => radio.checked);
          markInvalid(element, !checked);
          if (!checked) valid = false;
        } else if (element.type === 'checkbox') {
          document.getElementById('confirm-err').style.display = element.checked ? 'none' : 'block';
          if (!element.checked) valid = false;
        } else {
          const invalid = !element.value.trim();
          markInvalid(element, invalid);
          if (invalid) valid = false;
        }
      });
      if (!valid) {
        const firstInvalid = form.querySelector('.invalid, .err-msg[style*="block"]');
        if (firstInvalid) firstInvalid.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (!ENDPOINT.startsWith('https://script.google.com/macros/s/')) {
        status.textContent = '現在、送信先の設定を準備しています。店舗スタッフへお声がけください。';
        status.style.display = 'block';
        return;
      }

      button.disabled = true;
      button.textContent = '送信中…';
      const data = Object.fromEntries(new FormData(form).entries());
      data.submitted_at = new Date().toLocaleString('ja-JP');
      try {
        await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
        form.style.display = 'none';
        document.getElementById('done').style.display = 'block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (error) {
        button.disabled = false;
        button.textContent = 'この内容で登録する';
        status.textContent = '送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。';
        status.style.display = 'block';
      }
    });
  </script>
</body>
</html>
